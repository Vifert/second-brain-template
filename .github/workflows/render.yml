name: render
on:
  push:
    branches: [main]
  pull_request:
    paths: ['Excalidraw/**', 'tools/**', 'README.md', 'docs/**', '.obsidian/plugins/obsidian-excalidraw-plugin/**']
permissions:
  contents: read
concurrency:
  group: render-${{ github.ref }}
  cancel-in-progress: true
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: node tools/install-excalidraw.js
      - run: node tools/excalidraw.js check
      - run: node tools/excalidraw.js lint second-brain-architecture
      - name: The README's diagram matches the drawing
        run: |
          want=$(node tools/excalidraw.js hash second-brain-architecture)
          grep -q "drawing-hash: $want" README.md || { echo "README diagram is stale: re-render docs/assets/architecture*.png and update its drawing-hash to $want"; exit 1; }
