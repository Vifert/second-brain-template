name: links
on:
  pull_request:
    paths: ['**/*.md']
  schedule:
    - cron: '0 6 * * 1'
permissions:
  contents: read
jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          # Obsidian resolves a drawing embed, ![[name.excalidraw]], by basename
          # under Excalidraw/; lychee reads it as a file beside the note.
          # release-please writes a compare link to the tag its PR is about to
          # create, so on every release PR that link is a 404 until the merge.
          args: --no-progress --exclude '^https://example\.com' --exclude '\.excalidraw$' --exclude '^https://github\.com/Vifert/second-brain-template/compare/' './**/*.md'
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
